# Alembic (database migrations). Run from the repo root:
#   uv run alembic -c api/alembic.ini upgrade head
# The database address comes from DATABASE_URL (see api/migrations/env.py), not from this file.

[alembic]
script_location = %(here)s/migrations
# run from the repo root, so `import api...` works inside migrations/env.py
prepend_sys_path = .
path_separator = os
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
