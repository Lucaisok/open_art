# OpenArt — nginx site for open-art.lucadev.org
# Install: sudo cp deploy/nginx/open-art.conf /etc/nginx/conf.d/
#          sudo nginx -t && sudo systemctl reload nginx
#          sudo certbot --nginx -d open-art.lucadev.org   (adds HTTPS + the http→https redirect)
#
# nginx only talks to Next.js. Next forwards /api/* to FastAPI itself (web/next.config.ts),
# so the API is never exposed directly.

server {
    listen 80;
    listen [::]:80;
    server_name open-art.lucadev.org;

    # uploads (CV, statement…) are capped at 10 MB by the API too
    client_max_body_size 10m;

    location / {
        proxy_pass http://127.0.0.1:3040;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
