[project]
name = "open-art"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20.0",
    "argon2-cffi>=25.1.0",
    "beautifulsoup4>=4.15.0",
    "dateparser>=1.4.3",
    "email-validator>=2.3.0",
    "fastapi>=0.142.4",
    "fastembed>=0.7.4",
    "langdetect>=1.0.9",
    "openai>=3.17.0",
    "pandas>=3.0.6",
    "psycopg[binary]>=3.3.6",
    "pydantic>=2.13.5",
    "pypdf>=6.19.0",
    "python-docx>=1.2.0",
    "python-dotenv>=1.2.3",
    "pyyaml>=6.0.3",
    "requests>=2.34.2",
    "scikit-learn>=1.9.1",
    "sqlalchemy>=2.1.4",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "ipykernel>=7.3.0",
    "matplotlib>=3.11.2",
    "nbconvert>=7.17.1",
    "pytest>=9.1.1",
    "seaborn>=0.13.2",
]

[tool.uv]
# Intel macOS (the dev laptop) must stay installable: onnxruntime >= 1.24 ships no
# macosx x86_64 wheel, so this makes uv resolve to a version that still has one
# (see workflow.MD, "Embedding runtime: fastembed, not PyTorch")
required-environments = [
    "sys_platform == 'darwin' and platform_machine == 'x86_64'",
]

[tool.pytest.ini_options]
# tests import `src.…` the same way the scripts do, from the repo root
pythonpath = ["."]
testpaths = ["tests"]
